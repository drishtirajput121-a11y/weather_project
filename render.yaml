databases:
  - name: weather-db
    plan: free
    databaseName: weather_db
    user: weather_user

services:
  - type: web
    name: weather-dashboard
    plan: free
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn weather_project.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: weather-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
